        mnemonic: '口訣：「損失 × (保額 ÷ [價值 × 80%])」—— 不足額投保自負差額比例！'

      {

        details: [
          '【單獨海損】：僅由該受損標的物所有人自行承擔之意外損失（如風浪浸水、碰撞部分損害）。'
        ],
        mnemonic: '口訣：「為大家拋貨犧牲是『共同海損』；自己倒楣受損是『單獨海損』」'
      },
      {
        id: 402,
        year: '113年',
        category: '保險實務',
        topic: '傷害保險（意外險）三要素',
        question: '傷害保險（意外險）所界定之意外傷害事故，必須同時符合下列哪三大核心要件？',
        options: [
          '非疾病引起的、外來的、突發的',
          '外來的、預期的、嚴重的',
          '突發的、高額的、非自願的',
          '自發的、瞬間的、身體的'
        ],
        answer: 0, // A
        lawBasis: '《保險法》第 131 條第 2 項',
        explanation: '傷害保險所稱意外傷害事故，指非由疾病引起之「外來」、「突發」事故，三要件缺一不可。',
        details: [
          '【三大要件意涵】：',
          '1. 外來性：傷害原因來自自身體質或疾病以外之外部原因（如車禍、跌倒）。',
          '2. 突發性：事故發生為不可預期且瞬間發生。',
          '3. 非疾病性：非因個人體內器官病變、慢性病或感染性疾病所致。'
        ],
        mnemonic: '口訣：「外來、突發、非疾病」—— 意外險黃金三本柱'
      },
      {
        id: 403,
        year: '113年',
        category: '保險法規',
        topic: '洗錢防制法 - 實質受益人',
        question: '保險業辦理確認客戶身分（CDD），客戶為法人時，直接或間接持有該法人股份或資本超過多少比例之自然人，應認定為實質受益人？',
        options: [
          '超過 10%',
          '超過 15%',
          '超過 25%',
          '超過 50%'
        ],
        answer: 2, // C
        lawBasis: '《保險業防制洗錢及打擊資恐內部控制與稽核制度實施辦法》第 6 條',
        explanation: '辨識法人的實質受益人（UBO），依國際 FATF 標準與台灣法規，具控制權之持股門檻為「超過 25%」之自然人。',
        details: [
          '【穿透原則】：若由法人股東持股，需層層穿透直到找出持股超過 25% 的最終自然人股東。'
        ],
        mnemonic: '口訣：「實質受益人持股線：超過 25%（四分之一）」'
      }
    ];

    // 高頻速記考點整理
    const SUMMARY_NOTES = [
      {
        category: '必考數字精華排行榜',
        items: [
          { term: '保單審閱期', value: '不得少於 3 日', note: '個人傳統型險種' },
          { term: '解約權行使時效', value: '知情 1 個月 / 訂約 2 年', note: '保險法 §64 違反告知義務' },
          { term: '保險金請求權時效', value: '得請求之日起 2 年', note: '保險法 §65 消滅時效' },
          { term: '業務員停招處分', value: '3 個月以上 1 年以下', note: '累計滿 2 年撤銷登錄' },
          { term: '微電車未投保罰鍰', value: '750 ~ 1,500 元', note: '最新修訂強制車險罰則' },
          { term: '實質受益人門檻', value: '持股/資本超過 25%', note: '洗錢防制法 CDD 規範' }
        ]
      },
      {
        category: '法定額度與核心條款對照',
        items: [
          { term: '強制車險 - 死亡/失能', value: '每人最高 200 萬元', note: '無過失責任 (1~15等級)' },
          { term: '強制車險 - 傷害醫療', value: '每人最高 20 萬元', note: '急救、診療、接送、看護' },
          { term: '住宅地震基本保險', value: '保額 150 萬 + 住宿 20 萬', note: '限「全損 (全倒/半倒/逾50%)」' },
          { term: '共保條款理賠公式', value: '損失 × [保額 ÷ (價值 × 共保%)]', note: '不足額投保比例分攤' },
          { term: '車體險等級劃分', value: '甲式(含不明) > 乙式(自撞) > 丙式(車碰車)', note: '天災泡水須加保天災險' }
        ]
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('quiz'); // 'quiz', 'mistakes', 'bookmarks', 'notes'
      const [studyMode, setStudyMode] = useState(false); // true: 背題速讀模式 (直接顯示詳解)
      const [questions, setQuestions] = useState(TEN_YEAR_QUESTIONS);
      const [currentIdx, setCurrentIdx] = useState(0);
      const [selectedAnswers, setSelectedAnswers] = useState({});
      const [showExplanation, setShowExplanation] = useState({});
      const [selectedCategory, setSelectedCategory] = useState('全部');
      const [searchQuery, setSearchQuery] = useState('');

      // 收藏本與錯題本
      const [bookmarks, setBookmarks] = useState(() => {
        try {
          const s = localStorage.getItem('ins_10yr_v2_bookmarks');
          return s ? JSON.parse(s) : [];
        } catch { return []; }
      });
      const [mistakes, setMistakes] = useState(() => {
        try {
          const s = localStorage.getItem('ins_10yr_v2_mistakes');
          return s ? JSON.parse(s) : [];
        } catch { return []; }
      });

      // 模擬考狀態
      const [isExamMode, setIsExamMode] = useState(false);
      const [examTimer, setExamTimer] = useState(2400); // 40分鐘
      const [examFinished, setExamFinished] = useState(false);
      const [examScore, setExamScore] = useState(null);

      useEffect(() => {
        try { localStorage.setItem('ins_10yr_v2_bookmarks', JSON.stringify(bookmarks)); } catch(e){}
      }, [bookmarks]);

      useEffect(() => {
        try { localStorage.setItem('ins_10yr_v2_mistakes', JSON.stringify(mistakes)); } catch(e){}
      }, [mistakes]);

      // 考試倒數
      useEffect(() => {
        let t = null;
        if (isExamMode && !examFinished && examTimer > 0) {
          t = setInterval(() => setExamTimer(prev => prev - 1), 1000);
        } else if (examTimer === 0 && isExamMode && !examFinished) {
          handleFinishExam();
        }
        return () => clearInterval(t);
      }, [isExamMode, examFinished, examTimer]);

      // 動態題目篩選
      const filteredQuestions = useMemo(() => {
        let list = [...questions];
        if (activeTab === 'mistakes') list = list.filter(q => mistakes.includes(q.id));
        if (activeTab === 'bookmarks') list = list.filter(q => bookmarks.includes(q.id));
        if (selectedCategory !== '全部' && activeTab !== 'mistakes' && activeTab !== 'bookmarks') {
          list = list.filter(q => q.category === selectedCategory);
        }
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          list = list.filter(item =>
            item.question.toLowerCase().includes(q) ||
            item.topic.toLowerCase().includes(q) ||
            item.explanation.toLowerCase().includes(q) ||
            item.options.some(o => o.toLowerCase().includes(q))
          );
        }
        return list;
      }, [questions, activeTab, mistakes, bookmarks, selectedCategory, searchQuery]);

      const currentQuestion = filteredQuestions[currentIdx] || null;

      const handleSelectOption = (qId, optionIdx) => {
        if (examFinished && isExamMode) return;
        setSelectedAnswers(prev => ({ ...prev, [qId]: optionIdx }));

        const q = questions.find(i => i.id === qId);
        if (q && q.answer !== optionIdx && !mistakes.includes(qId)) {
          setMistakes(prev => [...prev, qId]);
        }
        if (!isExamMode) {
          setShowExplanation(prev => ({ ...prev, [qId]: true }));
        }
      };

      const toggleBookmark = (qId) => {
        setBookmarks(prev => prev.includes(qId) ? prev.filter(id => id !== qId) : [...prev, qId]);
      };

      const startMockExam = () => {
        const shuffled = [...TEN_YEAR_QUESTIONS].sort(() => 0.5 - Math.random());
        setQuestions(shuffled);
        setCurrentIdx(0);
        setSelectedAnswers({});
        setShowExplanation({});
        setIsExamMode(true);
        setStudyMode(false);
        setExamTimer(2400);
        setExamFinished(false);
        setExamScore(null);
        setActiveTab('quiz');
        setSelectedCategory('全部');
      };

      const handleFinishExam = () => {
        let correct = 0;
        filteredQuestions.forEach(q => {
          if (selectedAnswers[q.id] === q.answer) correct++;
        });
        const total = filteredQuestions.length;
        const score = total > 0 ? Math.round((correct / total) * 100) : 0;
        setExamScore({ correct, total, score, passed: score >= 70 });
        setExamFinished(true);
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      return (
        <div className="min-h-screen flex flex-col justify-between max-w-3xl mx-auto p-3 sm:p-5">
          {/* Header 頂部導航 */}
          <header className="flex items-center justify-between py-3 border-b border-slate-800">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-xl">🛡️</span>
                <h1 className="font-extrabold text-base sm:text-lg text-white">產險業務員十年真題逐題詳解</h1>
              </div>
              <p className="text-[11px] text-slate-400">含法規依據 ‧ 詳細剖析 ‧ 避坑口訣</p>
            </div>

            <div className="flex items-center gap-2">
              {/* 模式切換按鈕 (非考試時可用) */}
              {!isExamMode && activeTab !== 'notes' && (
                <button
                  onClick={() => setStudyMode(!studyMode)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all border ${
                    studyMode
                      ? 'bg-amber-500/20 text-amber-300 border-amber-500/40'
                      : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'
                  }`}
                  title="切換是否直接顯示所有題目解答與法條"
                >
                  {studyMode ? '📖 背題模式' : '✍️ 測驗模式'}
                </button>
              )}

              {isExamMode ? (
                <div className="flex items-center gap-2">
                  <span className="px-3 py-1 rounded-full text-xs font-mono bg-amber-500/20 text-amber-300 border border-amber-500/40">
                    ⏱️ {formatTime(examTimer)}
                  </span>
                  <button onClick={handleFinishExam} className="px-3 py-1.5 rounded-lg bg-rose-600 text-white text-xs font-bold">
                    交卷結算
                  </button>
                </div>
              ) : (
                <button onClick={startMockExam} className="px-3 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold">
                  ⚡ 模擬測驗
                </button>
              )}
            </div>
          </header>

          {/* Tab 標籤切換列 */}
          <div className="grid grid-cols-4 gap-1.5 my-3 bg-slate-900 p-1.5 rounded-xl border border-slate-800 text-xs font-medium text-center">
            <button
              onClick={() => { setActiveTab('quiz'); setIsExamMode(false); }}
              className={`py-2 rounded-lg transition-all ${activeTab === 'quiz' && !isExamMode ? 'bg-emerald-600 text-white font-bold' : 'text-slate-400 hover:text-white'}`}
            >
              📖 歷屆刷題
            </button>
            <button
              onClick={() => { setActiveTab('mistakes'); setIsExamMode(false); }}
              className={`py-2 rounded-lg transition-all ${activeTab === 'mistakes' ? 'bg-rose-600 text-white font-bold' : 'text-slate-400 hover:text-white'}`}
            >
              ❌ 錯題本 ({mistakes.length})
            </button>
            <button
              onClick={() => { setActiveTab('bookmarks'); setIsExamMode(false); }}
              className={`py-2 rounded-lg transition-all ${activeTab === 'bookmarks' ? 'bg-amber-600 text-white font-bold' : 'text-slate-400 hover:text-white'}`}
            >
              ⭐ 收藏 ({bookmarks.length})
            </button>
            <button
              onClick={() => { setActiveTab('notes'); setIsExamMode(false); }}
              className={`py-2 rounded-lg transition-all ${activeTab === 'notes' ? 'bg-indigo-600 text-white font-bold' : 'text-slate-400 hover:text-white'}`}
            >
              💡 考點速記
            </button>
          </div>

          {/* 主要作答與詳解區域 */}
          <main className="flex-1 space-y-3 pb-16">
            {/* 考試結算看板 */}
            {examFinished && examScore && (
              <div className="p-5 rounded-2xl bg-slate-900 border border-slate-700 text-center space-y-2">
                <h2 className="text-lg font-bold">{examScore.passed ? '🎉 測驗合格！已達標！' : '💪 還需加把勁！及格標準為 70 分'}</h2>
                <p className="text-3xl font-mono font-extrabold text-emerald-400">{examScore.score} 分</p>
                <p className="text-xs text-slate-400">答對 {examScore.correct} / 共 {examScore.total} 題</p>
                <div className="flex justify-center gap-2 mt-3">
                  <button onClick={() => { setExamFinished(false); setIsExamMode(false); }} className="px-3 py-1.5 rounded-lg bg-slate-800 text-xs">
                    查看各題詳解
                  </button>
                  <button onClick={startMockExam} className="px-4 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-bold">
                    再測一次
                  </button>
                </div>
              </div>
            )}

            {/* 考點速記卡畫面 (Notes Tab) */}
            {activeTab === 'notes' ? (
              <div className="space-y-3">
                {SUMMARY_NOTES.map((group, idx) => (
                  <div key={idx} className="p-4 rounded-xl bg-slate-900 border border-slate-800 space-y-2.5">
                    <h3 className="text-xs font-bold text-indigo-400 border-b border-slate-800 pb-1.5">{group.category}</h3>
                    <div className="space-y-2">
                      {group.items.map((item, i) => (
                        <div key={i} className="p-2.5 rounded-lg bg-slate-950 border border-slate-850 flex justify-between items-start">
                          <div>
                            <p className="text-xs font-semibold text-slate-200">{item.term}</p>
                            <p className="text-[11px] text-slate-500 mt-0.5">{item.note}</p>
                          </div>
                          <span className="text-xs font-bold text-emerald-400 font-mono bg-emerald-950 px-2 py-0.5 rounded border border-emerald-800/40">
                            {item.value}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              <>
                {/* 篩選與搜尋欄 */}
                {!isExamMode && (
                  <div className="flex gap-2">
                    <select
                      value={selectedCategory}
                      onChange={(e) => { setSelectedCategory(e.target.value); setCurrentIdx(0); }}
                      className="bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-300"
                    >
                      <option value="全部">全部考科</option>
                      <option value="保險法規">保險法規</option>
                      <option value="保險實務">保險實務</option>
                    </select>
                    <input
                      type="text"
                      placeholder="搜尋考題（如：強制險、共保、消滅時效）..."
                      value={searchQuery}
                      onChange={(e) => { setSearchQuery(e.target.value); setCurrentIdx(0); }}
                      className="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                )}

                {/* 題目與詳細解析卡片 */}
                {currentQuestion ? (
                  <div className="p-4 sm:p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-4 shadow-lg">
                    {/* 標籤列 */}
                    <div className="flex justify-between items-center text-xs">
                      <div className="flex gap-1.5 items-center flex-wrap">
                        <span className="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-mono">{currentQuestion.year}</span>
                        <span className={`px-2 py-0.5 rounded ${currentQuestion.category === '保險法規' ? 'bg-blue-500/20 text-blue-400' : 'bg-emerald-500/20 text-emerald-400'}`}>
                          {currentQuestion.category}
                        </span>
                        <span className="text-slate-400">{currentQuestion.topic}</span>
                      </div>
                      <button onClick={() => toggleBookmark(currentQuestion.id)} className="p-1.5 text-slate-400 hover:text-amber-400">
                        {bookmarks.includes(currentQuestion.id) ? '⭐ 已收藏' : '☆ 收藏'}
                      </button>
                    </div>

                    {/* 題目主體 */}
                    <div className="space-y-1">
                      <div className="text-[11px] text-slate-500 font-mono">
                        第 {currentIdx + 1} 題 / 共 {filteredQuestions.length} 題
                      </div>
                      <p className="text-sm sm:text-base font-semibold text-slate-100 leading-relaxed">
                        {currentQuestion.question}
                      </p>
                    </div>

                    {/* 選項列表 */}
                    <div className="space-y-2">
                      {currentQuestion.options.map((opt, optIdx) => {
                        const isSelected = selectedAnswers[currentQuestion.id] === optIdx;
                        const isCorrect = currentQuestion.answer === optIdx;
                        const hasAnswered = selectedAnswers[currentQuestion.id] !== undefined;
                        const showAnswerVisual = (hasAnswered && !isExamMode) || studyMode;

                        let style = "bg-slate-950 border-slate-850 text-slate-300 hover:border-slate-700";
                        let badgeStyle = "bg-slate-800 text-slate-400";

                        if (showAnswerVisual) {
                          if (isCorrect) {
                            style = "bg-emerald-950/80 border-emerald-500 text-emerald-200 font-bold";
                            badgeStyle = "bg-emerald-600 text-white font-bold";
                          } else if (isSelected && !isCorrect) {
                            style = "bg-rose-950/80 border-rose-500 text-rose-200";
                            badgeStyle = "bg-rose-600 text-white font-bold";
                          }
                        } else if (isSelected) {
                          style = "bg-emerald-900/60 border-emerald-500 text-emerald-200 font-bold";
                          badgeStyle = "bg-emerald-500 text-slate-950 font-bold";
                        }

                        return (
                          <button
                            key={optIdx}
                            onClick={() => handleSelectOption(currentQuestion.id, optIdx)}
                            className={`w-full p-3 rounded-xl border text-left text-xs sm:text-sm flex items-start gap-2.5 transition-all ${style}`}
                          >
                            <span className={`w-5 h-5 rounded-md text-center text-xs font-bold shrink-0 mt-0.5 flex items-center justify-center ${badgeStyle}`}>
                              {['A','B','C','D'][optIdx]}
                            </span>
                            <span className="flex-1 leading-snug">{opt}</span>
                          </button>
                        );
                      })}
                    </div>

                    {/* 完整詳細解析區塊 (答題後或開啟背題模式時展示) */}
                    {((!isExamMode && (showExplanation[currentQuestion.id] || selectedAnswers[currentQuestion.id] !== undefined)) || studyMode) && (
                      <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 text-xs space-y-3 mt-4 animate-in fade-in duration-200">
                        {/* 正確解答與法條依據 */}
                        <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-850 pb-2">
                          <div className="text-emerald-400 font-extrabold text-sm flex items-center gap-1">
                            <span>✅ 正確解答：選項 {['A','B','C','D'][currentQuestion.answer]}</span>
                          </div>
                          {currentQuestion.lawBasis && (
                            <span className="px-2.5 py-0.5 rounded-full bg-blue-500/20 text-blue-300 font-medium text-[11px] border border-blue-500/30">
                              📜 {currentQuestion.lawBasis}
                            </span>
                          )}
                        </div>

                        {/* 核心說明 */}
                        <div className="space-y-1.5 text-slate-300 leading-relaxed">
                          <p className="font-semibold text-slate-200">【核心解析】：</p>
                          <p className="bg-slate-900/80 p-2.5 rounded-lg border border-slate-800/80">{currentQuestion.explanation}</p>
                        </div>

                        {/* 詳細分析與法規條文 */}
                        {currentQuestion.details && currentQuestion.details.length > 0 && (
                          <div className="space-y-1.5 text-slate-300 leading-relaxed">
                            <p className="font-semibold text-slate-200">【深度法理與選項剖析】：</p>
                            <div className="space-y-1 pl-1 text-[11px] text-slate-400">
                              {currentQuestion.details.map((detail, dIdx) => (
                                <p key={dIdx} className="leading-normal">{detail}</p>
                              ))}
                            </div>
                          </div>
                        )}

                        {/* 記憶口訣 */}
                        {currentQuestion.mnemonic && (
                          <div className="p-2.5 rounded-lg bg-amber-500/10 border border-amber-500/30 text-amber-200 text-[11px] flex items-start gap-1.5">
                            <span className="shrink-0">🎯</span>
                            <span><strong>{currentQuestion.mnemonic}</strong></span>
                          </div>
                        )}
                      </div>
                    )}

                    {/* 翻頁與跳題控制 */}
                    <div className="flex justify-between items-center pt-3 border-t border-slate-800 text-xs">
                      <button
                        onClick={() => setCurrentIdx(p => Math.max(0, p - 1))}
                        disabled={currentIdx === 0}
                        className="px-3.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 disabled:opacity-30 hover:bg-slate-700"
                      >
                        上一題
                      </button>
                      <span className="text-slate-400 font-mono">{currentIdx + 1} / {filteredQuestions.length}</span>
                      <button
                        onClick={() => setCurrentIdx(p => Math.min(filteredQuestions.length - 1, p + 1))}
                        disabled={currentIdx === filteredQuestions.length - 1}
                        className="px-3.5 py-1.5 rounded-lg bg-emerald-600 font-bold text-white disabled:opacity-30 hover:bg-emerald-500"
                      >
                        下一題
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="p-8 text-center text-slate-500 text-xs bg-slate-900 rounded-2xl border border-slate-800">
                    無符合條件之題目
                  </div>
                )}
              </>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
