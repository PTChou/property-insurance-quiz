    function App() {
      // 題庫資料庫狀態
      const [examDatabase, setExamDatabase] = useState(() => {
        try {
          const saved = localStorage.getItem('fin_custom_exam_database');
          return saved ? JSON.parse(saved) : DEFAULT_SEED_DATABASE;
        } catch {
          return DEFAULT_SEED_DATABASE;
        }
      });

      // 第一層主考科
      const [currentSubject, setCurrentSubject] = useState('人身保險');
      // 第二層子分類：'全部', '保險法規', '保險實務'
      const [currentSubCategory, setCurrentSubCategory] = useState('全部');

      const [activeTab, setActiveTab] = useState('quiz');
      const [studyMode, setStudyMode] = useState(false);
      const [currentIdx, setCurrentIdx] = useState(0);
      const [selectedAnswers, setSelectedAnswers] = useState({});
      const [showExplanation, setShowExplanation] = useState({});
      const [searchQuery, setSearchQuery] = useState('');
      const [bookmarks, setBookmarks] = useState(() => JSON.parse(localStorage.getItem('fin_all_bookmarks') || '{}'));
      const [mistakes, setMistakes] = useState(() => JSON.parse(localStorage.getItem('fin_all_mistakes') || '{}'));
      
      const [isExamMode, setIsExamMode] = useState(false);
      const [examTimer, setExamTimer] = useState(2400);
      const [examQuestions, setExamQuestions] = useState([]);
      const [examFinished, setExamFinished] = useState(false);
      const [examScore, setExamScore] = useState(null);
      const [autoLoadMsg, setAutoLoadMsg] = useState('');

      const fileInputRef = useRef(null);

      // 保存至本機快取
      useEffect(() => { localStorage.setItem('fin_all_bookmarks', JSON.stringify(bookmarks)); }, [bookmarks]);
      useEffect(() => { localStorage.setItem('fin_all_mistakes', JSON.stringify(mistakes)); }, [mistakes]);

      // GitHub Pages 雲端靜默同步載入
      useEffect(() => {
        const subjects = ['人身保險', '財產保險', '金融市場常識', '職業道德'];
        subjects.forEach(sub => {
          fetch(`./${sub}.json`)
            .then(res => {
              if (!res.ok) throw new Error();
              return res.json();
            })
            .then(data => {
              if (Array.isArray(data) && data.length > 0) {
                // 自動正規化資料：若題目包含法規/實務關鍵字自動賦予 subCategory
                const normalized = data.map(item => {
                  let subCat = item.subCategory;
                  if (!subCat) {
                    const text = (item.topic || '') + (item.question || '') + (item.lawBasis || '');
                    if (text.includes('法規') || text.includes('保險法') || text.includes('規則') || text.includes('條款') || text.includes('罰則') || text.includes('稅')) {
                      subCat = '保險法規';
                    } else {
                      subCat = '保險實務';
                    }
                  }
                  return { ...item, subCategory: subCat };
                });

                setExamDatabase(prev => {
                  const updated = { ...prev, [sub]: normalized };
                  localStorage.setItem('fin_custom_exam_database', JSON.stringify(updated));
                  return updated;
                });
                setAutoLoadMsg(`⚡ 已從雲端同步最新【${sub}】題庫！`);
                setTimeout(() => setAutoLoadMsg(''), 3500);
              }
            })
            .catch(() => {});
        });
      }, []);

      // 計時器
      useEffect(() => {
        let t = null;
        if (isExamMode && !examFinished && examTimer > 0) t = setInterval(() => setExamTimer(p => p - 1), 1000);
        else if (examTimer === 0 && isExamMode && !examFinished) handleFinishExam();
        return () => clearInterval(t);
      }, [isExamMode, examFinished, examTimer]);

      // 手動上傳外掛題庫
      const handleImportQuestions = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (Array.isArray(data) && data.length > 0 && data[0].question) {
              const normalized = data.map(item => {
                let subCat = item.subCategory;
                if (!subCat) {
                  const text = (item.topic || '') + (item.question || '') + (item.lawBasis || '');
                  if (text.includes('法規') || text.includes('保險法') || text.includes('規則') || text.includes('條款') || text.includes('罰則') || text.includes('稅')) {
                    subCat = '保險法規';
                  } else {
                    subCat = '保險實務';
                  }
                }
                return { ...item, subCategory: subCat };
              });

              const updatedDB = { ...examDatabase, [currentSubject]: normalized };
              setExamDatabase(updatedDB);
              localStorage.setItem('fin_custom_exam_database', JSON.stringify(updatedDB));
              alert(`🎉 成功掛載 ${normalized.length} 題至【${currentSubject}】！已自動完成法規與實務分類。`);
            } else if (typeof data === 'object') {
              setExamDatabase(data);
              localStorage.setItem('fin_custom_exam_database', JSON.stringify(data));
              alert('🎉 成功掛載整套大題庫！');
            }
            setCurrentIdx(0);
            setSelectedAnswers({});
            setShowExplanation({});
          } catch {
            alert('❌ JSON 格式不符合規範！');
          }
        };
        reader.readAsText(file);
      };

      // 取得當前主科目的所有題目
      const currentSubjectRawQuestions = useMemo(() => examDatabase[currentSubject] || [], [examDatabase, currentSubject]);

      // 依【第二層子分類】過濾題目
      const currentSubjectQuestions = useMemo(() => {
        if (currentSubCategory === '全部') return currentSubjectRawQuestions;
        return currentSubjectRawQuestions.filter(q => {
          const cat = q.subCategory || '';
          const topic = q.topic || '';
          if (currentSubCategory === '保險法規') {
            return cat.includes('法規') || topic.includes('法規') || topic.includes('法條') || topic.includes('規則');
          }
          if (currentSubCategory === '保險實務') {
            return cat.includes('實務') || topic.includes('實務') || (!cat.includes('法規') && !topic.includes('法規'));
          }
          return true;
        });
      }, [currentSubjectRawQuestions, currentSubCategory]);

      const currentSubjectBookmarks = bookmarks[currentSubject] || [];
      const currentSubjectMistakes = mistakes[currentSubject] || [];

      // 最終呈現在畫面的篩選清單
      const filteredQuestions = useMemo(() => {
        if (isExamMode) return examQuestions;
        let list = [...currentSubjectQuestions];
        if (activeTab === 'mistakes') list = list.filter(q => currentSubjectMistakes.includes(q.id));
        if (activeTab === 'bookmarks') list = list.filter(q => currentSubjectBookmarks.includes(q.id));
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          list = list.filter(i => 
            i.question.toLowerCase().includes(q) || 
            (i.topic && i.topic.toLowerCase().includes(q)) || 
            (i.explanation && i.explanation.toLowerCase().includes(q)) || 
            (i.options && i.options.some(o => o.toLowerCase().includes(q)))
          );
        }
        return list;
      }, [currentSubjectQuestions, activeTab, currentSubjectMistakes, currentSubjectBookmarks, searchQuery, isExamMode, examQuestions]);

      useEffect(() => { if (currentIdx >= filteredQuestions.length && filteredQuestions.length > 0) setCurrentIdx(0); }, [filteredQuestions.length, currentIdx]);

      const currentQuestion = filteredQuestions[currentIdx] || null;

      const handleSelectOption = (qId, optionIdx) => {
        if (examFinished && isExamMode) return;
        setSelectedAnswers(prev => ({ ...prev, [qId]: optionIdx }));
        const q = currentSubjectRawQuestions.find(item => item.id === qId);
        if (q && q.answer !== optionIdx && !currentSubjectMistakes.includes(qId)) {
          setMistakes(prev => ({ ...prev, [currentSubject]: [...(prev[currentSubject] || []), qId] }));
        }
        if (!isExamMode) setShowExplanation(prev => ({ ...prev, [qId]: true }));
      };

      const toggleBookmark = (qId) => {
        setBookmarks(prev => {
          const cur = prev[currentSubject] || [];
          const updated = cur.includes(qId) ? cur.filter(id => id !== qId) : [...cur, qId];
          return { ...prev, [currentSubject]: updated };
        });
      };

      const startMockExam = () => {
        const pool = [...currentSubjectQuestions].sort(() => 0.5 - Math.random());
        const count = Math.min(50, pool.length);
        setExamQuestions(pool.slice(0, count));
        setCurrentIdx(0);
        setSelectedAnswers({});
        setShowExplanation({});
        setIsExamMode(true);
        setStudyMode(false);
        setExamTimer(2400);
        setExamFinished(false);
        setExamScore(null);
        setActiveTab('quiz');
      };

      const handleFinishExam = () => {
        let correct = 0;
        examQuestions.forEach(q => { if (selectedAnswers[q.id] === q.answer) correct++; });
        const total = examQuestions.length;
        const score = total > 0 ? Math.round((correct / total) * 100) : 0;
        setExamScore({ correct, total, score, passed: score >= 70 });
        setExamFinished(true);
      };

      const formatTime = (secs) => `${Math.floor(secs / 60).toString().padStart(2, '0')}:${(secs % 60).toString().padStart(2, '0')}`;

      // 各子分類數量統計
      const subCounts = useMemo(() => {
        let law = 0;
        let prac = 0;
        currentSubjectRawQuestions.forEach(q => {
          const str = (q.subCategory || '') + (q.topic || '');
          if (str.includes('法規') || str.includes('法條') || str.includes('規則')) law++;
          else prac++;
        });
        return { all: currentSubjectRawQuestions.length, law, prac };
      }, [currentSubjectRawQuestions]);

      return (
        <div className="min-h-screen flex flex-col justify-between max-w-3xl mx-auto p-3 sm:p-5">
          {/* Header 頂部 */}
          <header className="py-3 border-b border-slate-800 space-y-3">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="text-2xl">🏛️</span>
                <div>
                  <h1 className="font-extrabold text-base sm:text-lg text-white flex items-center gap-2">
                    金融證照題庫通關系統
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-emerald-400 font-mono border border-emerald-500/30">
                      {filteredQuestions.length} 題
                    </span>
                  </h1>
                  <p className="text-[11px] text-slate-400">人身 ‧ 產險 ‧ 金融常識 ‧ 職業道德</p>
                </div>
              </div>

              <div className="flex items-center gap-1.5 sm:gap-2">
                <input type="file" ref={fileInputRef} onChange={handleImportQuestions} accept=".json" className="hidden" />

                {!isExamMode ? (
                  <>
                    <button
                      onClick={() => fileInputRef.current.click()}
                      className="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium"
                      title="掛載自訂 JSON 題庫"
                    >
                      📥 匯入
                    </button>
                    <button
                      onClick={() => setStudyMode(!studyMode)}
                      className={`px-2.5 py-1.5 rounded-lg text-xs font-bold border transition-all ${studyMode ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' : 'bg-slate-800 text-slate-300 border-slate-700'}`}
                    >
                      {studyMode ? '📖 背題中' : '✍️ 測驗中'}
                    </button>
                    <button
                      onClick={startMockExam}
                      className="px-3.5 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold shadow"
                    >
                      ⚡ 模擬考
                    </button>
                  </>
                ) : (
                  <div className="flex items-center gap-2">
                    <span className="px-3 py-1 rounded-full text-xs font-mono bg-amber-500/20 text-amber-300 border border-amber-500/40">⏱️ {formatTime(examTimer)}</span>
                    <button onClick={handleFinishExam} className="px-3 py-1.5 rounded-lg bg-rose-600 text-white text-xs font-bold">交卷</button>
                  </div>
                )}
              </div>
            </div>

            {/* 同步提示訊息 */}
            {autoLoadMsg && (
              <div className="p-2 rounded-lg bg-emerald-950/60 border border-emerald-500/40 text-emerald-300 text-xs text-center animate-pulse">
                {autoLoadMsg}
              </div>
            )}

            {/* 第一層：大考科切換 */}
            {!isExamMode && (
              <div className="grid grid-cols-4 gap-1.5 bg-slate-900 p-1.5 rounded-xl border border-slate-800 text-xs font-bold text-center">
                {['人身保險', '財產保險', '金融市場常識', '職業道德'].map(sub => (
                  <button
                    key={sub}
                    onClick={() => {
                      setCurrentSubject(sub);
                      setCurrentSubCategory('全部');
                      setCurrentIdx(0);
                      setSelectedAnswers({});
                      setShowExplanation({});
                    }}
                    className={`py-2 rounded-lg transition-all ${currentSubject === sub ? 'bg-emerald-600 text-white shadow font-bold' : 'text-slate-400 hover:text-white'}`}
                  >
                    {sub}
                  </button>
                ))}
              </div>
            )}

            {/* 【核心亮點】：第二層 UI 子分類（當點選人身保險或財產保險時展開） */}
            {!isExamMode && (currentSubject === '人身保險' || currentSubject === '財產保險') && (
              <div className="flex items-center justify-center gap-2 bg-slate-900/60 p-1.5 rounded-xl border border-slate-800/80 text-xs animate-in fade-in duration-200">
                <span className="text-slate-500 text-[11px] font-semibold pl-1">考科單元：</span>
                <button
                  onClick={() => { setCurrentSubCategory('全部'); setCurrentIdx(0); }}
                  className={`px-3 py-1 rounded-lg transition-all ${
                    currentSubCategory === '全部'
                      ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 font-bold'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  全部 ({subCounts.all})
                </button>
                <button
                  onClick={() => { setCurrentSubCategory('保險法規'); setCurrentIdx(0); }}
                  className={`px-3 py-1 rounded-lg transition-all flex items-center gap-1 ${
                    currentSubCategory === '保險法規'
                      ? 'bg-blue-600 text-white font-bold shadow'
                      : 'bg-slate-800/80 text-slate-300 hover:bg-slate-800'
                  }`}
                >
                  <span>📘 保險法規</span>
                  <span className="text-[10px] opacity-80">({subCounts.law})</span>
                </button>
                <button
                  onClick={() => { setCurrentSubCategory('保險實務'); setCurrentIdx(0); }}
                  className={`px-3 py-1 rounded-lg transition-all flex items-center gap-1 ${
                    currentSubCategory === '保險實務'
                      ? 'bg-amber-600 text-white font-bold shadow'
                      : 'bg-slate-800/80 text-slate-300 hover:bg-slate-800'
                  }`}
                >
                  <span>📙 保險實務</span>
                  <span className="text-[10px] opacity-80">({subCounts.prac})</span>
                </button>
              </div>
            )}
          </header>

          {/* 功能副標籤 (完整刷題 / 錯題本 / 收藏夾) */}
          {!isExamMode && (
            <div className="grid grid-cols-3 gap-2 my-2.5 text-xs text-center font-medium">
              <button onClick={() => setActiveTab('quiz')} className={`py-1.5 rounded-lg border ${activeTab === 'quiz' ? 'bg-slate-800 text-emerald-400 border-emerald-500/40 font-bold' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>📚 單元刷題 ({filteredQuestions.length})</button>
              <button onClick={() => setActiveTab('mistakes')} className={`py-1.5 rounded-lg border ${activeTab === 'mistakes' ? 'bg-rose-950/60 text-rose-300 border-rose-500/40 font-bold' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>❌ 錯題本 ({currentSubjectMistakes.length})</button>
              <button onClick={() => setActiveTab('bookmarks')} className={`py-1.5 rounded-lg border ${activeTab === 'bookmarks' ? 'bg-amber-950/60 text-amber-300 border-amber-500/40 font-bold' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>⭐ 收藏夾 ({currentSubjectBookmarks.length})</button>
            </div>
          )}

          {/* 主答題區域 */}
          <main className="flex-1 space-y-3 pb-16">
            {/* 模擬考成績結算 */}
            {examFinished && examScore && (
              <div className="p-5 rounded-2xl bg-slate-900 border border-slate-700 text-center space-y-2">
                <h2 className="text-lg font-bold">{examScore.passed ? '🎉 恭喜及格！達到 70 分合格標準！' : '💪 還差一點及格！及格標準 70 分'}</h2>
                <p className={`text-4xl font-mono font-extrabold ${examScore.passed ? 'text-emerald-400' : 'text-rose-400'}`}>{examScore.score} 分</p>
                <p className="text-xs text-slate-400">答對：{examScore.correct} / {examScore.total} 題</p>
                <button onClick={() => { setExamFinished(false); setIsExamMode(false); }} className="mt-2 px-4 py-1.5 rounded-lg bg-slate-800 text-xs">查看逐題解析</button>
              </div>
            )}

            {!isExamMode && (
              <div className="relative">
                <input
                  type="text"
                  placeholder={`搜尋【${currentSubject}${currentSubCategory !== '全部' ? ' - ' + currentSubCategory : ''}】考題關鍵字、法條...`}
                  value={searchQuery}
                  onChange={e => { setSearchQuery(e.target.value); setCurrentIdx(0); }}
                  className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                />
              </div>
            )}

            {currentQuestion ? (
              <div className="p-4 sm:p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-4 shadow-xl">
                {/* 題目頂部標籤 */}
                <div className="flex justify-between items-center text-xs">
                  <div className="flex gap-1.5 items-center flex-wrap">
                    <span className={`px-2 py-0.5 rounded font-medium ${
                      (currentQuestion.subCategory || '').includes('法規') || (currentQuestion.topic || '').includes('法規')
                        ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30'
                        : 'bg-amber-500/20 text-amber-300 border border-amber-500/30'
                    }`}>
                      {currentQuestion.subCategory || currentQuestion.category}
                    </span>
                    <span className="text-slate-400">{currentQuestion.topic}</span>
                  </div>
                  <button onClick={() => toggleBookmark(currentQuestion.id)} className="text-slate-400 hover:text-amber-400 text-xs">
                    {currentSubjectBookmarks.includes(currentQuestion.id) ? '⭐ 已收藏' : '☆ 收藏'}
                  </button>
                </div>

                <div className="space-y-1">
                  <div className="text-[11px] text-slate-500 font-mono">第 {currentIdx + 1} 題 / 共 {filteredQuestions.length} 題（編號 #{currentQuestion.id}）</div>
                  <p className="text-sm sm:text-base font-semibold text-slate-100 leading-relaxed">{currentQuestion.question}</p>
                </div>

                {/* 選項清單 */}
                <div className="space-y-2">
                  {currentQuestion.options.map((opt, idx) => {
                    const isSelected = selectedAnswers[currentQuestion.id] === idx;
                    const isCorrect = currentQuestion.answer === idx;
                    const showAnswer = (selectedAnswers[currentQuestion.id] !== undefined && !isExamMode) || studyMode;
                    let style = "bg-slate-950 border-slate-850 text-slate-300 hover:border-slate-700";
                    let badgeStyle = "bg-slate-800 text-slate-400";

                    if (showAnswer) {
                      if (isCorrect) {
                        style = "bg-emerald-950/80 border-emerald-500 text-emerald-200 font-bold";
                        badgeStyle = "bg-emerald-600 text-white font-bold";
                      } else if (isSelected && !isCorrect) {
                        style = "bg-rose-950/80 border-rose-500 text-rose-200";
                        badgeStyle = "bg-rose-600 text-white font-bold";
                      }
                    } else if (isSelected) {
                      style = "bg-emerald-900/60 border-emerald-500 text-emerald-200";
                      badgeStyle = "bg-emerald-500 text-slate-950 font-bold";
                    }

                    return (
                      <button key={idx} onClick={() => handleSelectOption(currentQuestion.id, idx)} className={`w-full p-3 rounded-xl border text-left text-xs sm:text-sm flex items-start gap-2.5 transition-all ${style}`}>
                        <span className={`w-5 h-5 rounded text-center text-xs font-bold shrink-0 mt-0.5 flex items-center justify-center ${badgeStyle}`}>
                          {['A','B','C','D'][idx]}
                        </span>
                        <span className="flex-1 leading-snug">{opt}</span>
                      </button>
                    );
                  })}
                </div>

                {/* 逐題詳細解析 */}
                {((selectedAnswers[currentQuestion.id] !== undefined && !isExamMode) || studyMode) && (
                  <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 text-xs space-y-2 animate-in fade-in">
                    <div className="flex justify-between items-center border-b border-slate-850 pb-1.5">
                      <p className="text-emerald-400 font-bold">✅ 正確解答：選項 {['A','B','C','D'][currentQuestion.answer]}</p>
                      {currentQuestion.lawBasis && <span className="text-[11px] text-blue-300 bg-blue-500/20 px-2 py-0.5 rounded border border-blue-500/30">📜 {currentQuestion.lawBasis}</span>}
                    </div>
                    {currentQuestion.explanation && <p className="text-slate-300 leading-relaxed bg-slate-900/60 p-2.5 rounded-lg border border-slate-850">{currentQuestion.explanation}</p>}
                    {currentQuestion.mnemonic && <div className="p-2 rounded bg-amber-500/10 border border-amber-500/30 text-amber-200">🎯 {currentQuestion.mnemonic}</div>}
                  </div>
                )}

                {/* 翻頁控制 */}
                <div className="flex justify-between items-center pt-2 border-t border-slate-800 text-xs">
                  <button onClick={() => setCurrentIdx(p => Math.max(0, p - 1))} disabled={currentIdx === 0} className="px-3.5 py-1.5 rounded-lg bg-slate-800 disabled:opacity-30 hover:bg-slate-700">上一題</button>
                  <span className="text-slate-400 font-mono">{currentIdx + 1} / {filteredQuestions.length}</span>
                  <button onClick={() => setCurrentIdx(p => Math.min(filteredQuestions.length - 1, p + 1))} disabled={currentIdx === filteredQuestions.length - 1} className="px-3.5 py-1.5 rounded-lg bg-emerald-600 text-white font-bold disabled:opacity-30 hover:bg-emerald-500">下一題</button>
                </div>
              </div>
            ) : (
              <div className="p-8 text-center text-slate-500 text-xs bg-slate-900 rounded-xl space-y-1">
                <p>目前此單元無符合之題目</p>
                <p className="text-[11px] text-slate-600">請切換上方考科單元或清除搜尋條件</p>
              </div>
            )}
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
