        { id: "P104", category: "財產保險", topic: "車體損失保險", question: "自用汽車車體損失險丙式（車碰車），下列何種事故在承保理賠範圍內？", options: ["停於路邊遭不明刮傷", "倒車自撞自家水泥柱", "與領有牌照之他車碰撞且確認對方車輛", "颱風淹水造成引擎泡水受損"], answer: 2, lawBasis: "自用汽車車體損失險條款", explanation: "丙式車體險僅限「車碰車（對撞擦撞）」且必須確認對方號牌。", mnemonic: "口訣：丙式車碰車、乙式包自撞、甲式包不明刮傷！" },

        { id: "F103", category: "金融市場常識", topic: "初級與次級市場", question: "下列那個市場主要是買賣「已發行流通」的證券？", options: ["發行市場", "短期資金市場", "初級市場", "次級市場"], answer: 3, lawBasis: "金融市場常識題庫第 15 題", explanation: "初級市場是新發行籌資，次級市場為二手流通交易市場。", mnemonic: "口訣：初級是新發行、次級是二手流通買賣！" },

        { id: "F105", category: "金融市場常識", topic: "洗錢防制申報門檻", question: "洗錢防制法規定金融機構對於達一定金額以上之單筆現金通貨交易應向指定機構申報，該金額為：", options: ["25 萬元", "50 萬元", "75 萬元", "100 萬元"], answer: 1, lawBasis: "金融市場常識題庫第 81 題", explanation: "單筆現金收付或換鈔達新台幣 50 萬元以上之通貨交易應申報。", mnemonic: "口訣：大額現金 50 萬，身分登記報調查局！" },
        { id: "F106", category: "金融市場常識", topic: "存款保險保障", question: "現行每一存款人在同一家金融機構存款保險的最高保額為新台幣多少元？", options: ["新台幣 100 萬元", "新台幣 150 萬元", "新台幣 300 萬元", "新台幣 500 萬元"], answer: 2, lawBasis: "金融市場常識題庫第 84 題", explanation: "中央存保每一存款人最高保額為新台幣 300 萬元整。", mnemonic: "口訣：存保最高理賠 300 萬！" }
      ],
      "職業道德": [
        { id: "E101", category: "職業道德", topic: "保險招攬規範", question: "金融從業人員從事保險招攬行為，下列那一項是錯的？", options: ["解釋保險商品內容及保單條款", "說明填寫要保書注意事項、轉送要保文件及保險單", "經所屬公司授權從事保險招攬行為", "可以向未經授權公司從事保險招攬行為"], answer: 3, lawBasis: "職業道德題庫第 1 題", explanation: "業務員僅得為所屬經授權公司招攬，絕不可向未經授權公司招攬。", mnemonic: "口訣：只能為自己登錄授權的公司招攬，跨公司偷賣違法！" },
        { id: "E102", category: "職業道德", topic: "借牌與掛名懲處", question: "金融從業人員從事保險招攬時將本人登錄證提供他人進行招攬或掛名，會受到何種處分？", options: ["註銷登錄", "停止招攬 6 個月", "停止招攬 10 個月", "停止招攬 1 年"], answer: 1, lawBasis: "職業道德題庫第 5 條", explanation: "借牌掛名招攬者，所屬公司應處停止招攬行為 6 個月處分。", mnemonic: "口訣：借牌掛名招攬，停止招攬 6 個月起跳！" },
        { id: "E103", category: "職業道德", topic: "獲利保證禁止", question: "投顧人員告訴投資人：「買這支股票保證六個月內給你 100% 的報酬。」違反了哪一原則？", options: ["禁止為獲利或損失負擔之保證", "公平分配原則", "忠實誠信原則", "專業原則"], answer: 0, lawBasis: "職業道德題庫第 74 題", explanation: "法規嚴禁從業人員向客戶承諾保證獲利或共同承擔損失。", mnemonic: "口訣：千言萬語，就是不能承諾『保證獲利』！" },
        { id: "E104", category: "職業道德", topic: "保密原則", question: "基於職務獲得的客戶個人與交易資料，金融服務業從業人員應該如何做才正確？", options: ["轉賣給同業", "必須忠於保密原則，絕不對外洩露", "隨意丟棄在碎紙機旁", "提供給親朋好友參考"], answer: 1, lawBasis: "職業道德題庫第 431 題", explanation: "對客戶資料負有法定保密義務，在職與離職後皆同。", mnemonic: "口訣：客戶隱私與資料，在職離職都保密！" },
        { id: "E105", category: "職業道德", topic: "利益衝突", question: "金融從業人員在接受客戶委託時，應將誰的利益置於其他利益之上？", options: ["委託的客戶", "公司", "自己", "其他特定大客戶"], answer: 0, lawBasis: "職業道德題庫第 146 題", explanation: "忠實義務之核心為「客戶利益優先」。", mnemonic: "口訣：客戶利益永遠擺第一，禁止利益衝突與自肥！" },
        { id: "E106", category: "職業道德", topic: "代管印鑑禁止", question: "為提供便民服務，金融從業人員是否可以代客戶保管存摺、印鑑或已蓋章之空白取款條？", options: ["只要客戶同意即可", "絕對禁止代客戶保管存摺、印鑑及空白取款條", "VIP 客戶可代管", "親戚家人可代管"], answer: 1, lawBasis: "職業道德題庫第 11 題", explanation: "金管會理專十誡嚴格禁止代客保管任何重要取款憑證。", mnemonic: "口訣：存摺印章自己管，業務代管直接踩紅線！" }
      ]
    };

    function App() {
      const [currentSubject, setCurrentSubject] = useState('人身保險');
      const [activeTab, setActiveTab] = useState('quiz');
      const [studyMode, setStudyMode] = useState(false);
      const [currentIdx, setCurrentIdx] = useState(0);
      const [selectedAnswers, setSelectedAnswers] = useState({});
      const [showExplanation, setShowExplanation] = useState({});
      const [searchQuery, setSearchQuery] = useState('');
      const [bookmarks, setBookmarks] = useState(() => JSON.parse(localStorage.getItem('fin_all_bookmarks') || '{}'));
      const [mistakes, setMistakes] = useState(() => JSON.parse(localStorage.getItem('fin_all_mistakes') || '{}'));
      const [isExamMode, setIsExamMode] = useState(false);
      const [examTimer, setExamTimer] = useState(2400);
      const [examQuestions, setExamQuestions] = useState([]);
      const [examFinished, setExamFinished] = useState(false);
      const [examScore, setExamScore] = useState(null);

      useEffect(() => { localStorage.setItem('fin_all_bookmarks', JSON.stringify(bookmarks)); }, [bookmarks]);
      useEffect(() => { localStorage.setItem('fin_all_mistakes', JSON.stringify(mistakes)); }, [mistakes]);
      useEffect(() => {
        let t = null;
        if (isExamMode && !examFinished && examTimer > 0) t = setInterval(() => setExamTimer(p => p - 1), 1000);
        else if (examTimer === 0 && isExamMode && !examFinished) handleFinishExam();
        return () => clearInterval(t);
      }, [isExamMode, examFinished, examTimer]);

      const currentSubjectQuestions = useMemo(() => INITIAL_EXAM_DATABASE[currentSubject] || [], [currentSubject]);
      const currentSubjectBookmarks = bookmarks[currentSubject] || [];
      const currentSubjectMistakes = mistakes[currentSubject] || [];

      const filteredQuestions = useMemo(() => {
        if (isExamMode) return examQuestions;
        let list = [...currentSubjectQuestions];
        if (activeTab === 'mistakes') list = list.filter(q => currentSubjectMistakes.includes(q.id));
        if (activeTab === 'bookmarks') list = list.filter(q => currentSubjectBookmarks.includes(q.id));
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          list = list.filter(i => i.question.toLowerCase().includes(q) || i.topic.toLowerCase().includes(q) || i.options.some(o => o.toLowerCase().includes(q)));
        }
        return list;
      }, [currentSubjectQuestions, activeTab, currentSubjectMistakes, currentSubjectBookmarks, searchQuery, isExamMode, examQuestions]);

      useEffect(() => { if (currentIdx >= filteredQuestions.length && filteredQuestions.length > 0) setCurrentIdx(0); }, [filteredQuestions.length, currentIdx]);

      const currentQuestion = filteredQuestions[currentIdx] || null;

      const handleSelectOption = (qId, optionIdx) => {
        if (examFinished && isExamMode) return;
        setSelectedAnswers(prev => ({ ...prev, [qId]: optionIdx }));
        const q = currentSubjectQuestions.find(item => item.id === qId);
        if (q && q.answer !== optionIdx && !currentSubjectMistakes.includes(qId)) {
          setMistakes(prev => ({ ...prev, [currentSubject]: [...(prev[currentSubject] || []), qId] }));
        }
        if (!isExamMode) setShowExplanation(prev => ({ ...prev, [qId]: true }));
      };

      const toggleBookmark = (qId) => {
        setBookmarks(prev => {
          const cur = prev[currentSubject] || [];
          const updated = cur.includes(qId) ? cur.filter(id => id !== qId) : [...cur, qId];
          return { ...prev, [currentSubject]: updated };
        });
      };

      const startMockExam = () => {
        const pool = [...currentSubjectQuestions].sort(() => 0.5 - Math.random());
        setExamQuestions(pool.slice(0, Math.min(50, pool.length)));
        setCurrentIdx(0);
        setSelectedAnswers({});
        setShowExplanation({});
        setIsExamMode(true);
        setStudyMode(false);
        setExamTimer(2400);
        setExamFinished(false);
        setExamScore(null);
        setActiveTab('quiz');
      };

      const handleFinishExam = () => {
        let correct = 0;
        examQuestions.forEach(q => { if (selectedAnswers[q.id] === q.answer) correct++; });
        const total = examQuestions.length;
        const score = total > 0 ? Math.round((correct / total) * 100) : 0;
        setExamScore({ correct, total, score, passed: score >= 70 });
        setExamFinished(true);
      };

      const formatTime = (secs) => `${Math.floor(secs / 60).toString().padStart(2, '0')}:${(secs % 60).toString().padStart(2, '0')}`;

      return (
        <div className="min-h-screen flex flex-col justify-between max-w-3xl mx-auto p-3 sm:p-5">
          <header className="py-3 border-b border-slate-800 space-y-3">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="text-2xl">🏛️</span>
                <div>
                  <h1 className="font-extrabold text-base sm:text-lg text-white">金融證照四大考科題庫系統</h1>
                  <p className="text-[11px] text-slate-400">人身 ‧ 產險 ‧ 金融市場 ‧ 職業道德</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                {!isExamMode ? (
                  <>
                    <button onClick={() => setStudyMode(!studyMode)} className={`px-3 py-1.5 rounded-lg text-xs font-bold border ${studyMode ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' : 'bg-slate-800 text-slate-300 border-slate-700'}`}>
                      {studyMode ? '📖 背題模式' : '✍️ 測驗模式'}
                    </button>
                    <button onClick={startMockExam} className="px-3.5 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold">
                      ⚡ 模擬考
                    </button>
                  </>
                ) : (
                  <div className="flex items-center gap-2">
                    <span className="px-3 py-1 rounded-full text-xs font-mono bg-amber-500/20 text-amber-300 border border-amber-500/40">⏱️ {formatTime(examTimer)}</span>
                    <button onClick={handleFinishExam} className="px-3 py-1.5 rounded-lg bg-rose-600 text-white text-xs font-bold">交卷</button>
                  </div>
                )}
              </div>
            </div>
            {!isExamMode && (
              <div className="grid grid-cols-4 gap-1.5 bg-slate-900 p-1.5 rounded-xl border border-slate-800 text-xs font-bold text-center">
                {['人身保險', '財產保險', '金融市場常識', '職業道德'].map(sub => (
                  <button key={sub} onClick={() => { setCurrentSubject(sub); setCurrentIdx(0); setSelectedAnswers({}); setShowExplanation({}); }} className={`py-2 rounded-lg ${currentSubject === sub ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                    {sub}
                  </button>
                ))}
              </div>
            )}
          </header>

          {!isExamMode && (
            <div className="grid grid-cols-3 gap-2 my-2.5 text-xs text-center font-medium">
              <button onClick={() => setActiveTab('quiz')} className={`py-1.5 rounded-lg border ${activeTab === 'quiz' ? 'bg-slate-800 text-emerald-400 border-emerald-500/40 font-bold' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>📚 題庫 ({currentSubjectQuestions.length})</button>
              <button onClick={() => setActiveTab('mistakes')} className={`py-1.5 rounded-lg border ${activeTab === 'mistakes' ? 'bg-rose-950/60 text-rose-300 border-rose-500/40 font-bold' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>❌ 錯題本 ({currentSubjectMistakes.length})</button>
              <button onClick={() => setActiveTab('bookmarks')} className={`py-1.5 rounded-lg border ${activeTab === 'bookmarks' ? 'bg-amber-950/60 text-amber-300 border-amber-500/40 font-bold' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>⭐ 收藏 ({currentSubjectBookmarks.length})</button>
            </div>
          )}

          <main className="flex-1 space-y-3 pb-16">
            {examFinished && examScore && (
              <div className="p-5 rounded-2xl bg-slate-900 border border-slate-700 text-center space-y-2">
                <h2 className="text-lg font-bold">{examScore.passed ? '🎉 恭喜通過！達到 70 分合格！' : '💪 還差一點及格！及格標準 70 分'}</h2>
                <p className={`text-4xl font-mono font-extrabold ${examScore.passed ? 'text-emerald-400' : 'text-rose-400'}`}>{examScore.score} 分</p>
                <p className="text-xs text-slate-400">答對：{examScore.correct} / {examScore.total} 題</p>
                <button onClick={() => { setExamFinished(false); setIsExamMode(false); }} className="mt-2 px-4 py-1.5 rounded-lg bg-slate-800 text-xs">查看逐題解析</button>
              </div>
            )}

            {!isExamMode && (
              <div className="relative">
                <input type="text" placeholder={\`搜尋【\${currentSubject}】考題關鍵字...\`} value={searchQuery} onChange={e => { setSearchQuery(e.target.value); setCurrentIdx(0); }} className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-200" />
              </div>
            )}

            {currentQuestion ? (
              <div className="p-4 sm:p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-4">
                <div className="flex justify-between items-center text-xs">
                  <span className="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400">{currentQuestion.category} · {currentQuestion.topic}</span>
                  <button onClick={() => toggleBookmark(currentQuestion.id)} className="text-slate-400 hover:text-amber-400">{currentSubjectBookmarks.includes(currentQuestion.id) ? '⭐ 已收藏' : '☆ 收藏'}</button>
                </div>
                <p className="text-sm sm:text-base font-semibold text-slate-100">{currentIdx + 1}. {currentQuestion.question}</p>
                <div className="space-y-2">
                  {currentQuestion.options.map((opt, idx) => {
                    const isSelected = selectedAnswers[currentQuestion.id] === idx;
                    const isCorrect = currentQuestion.answer === idx;
                    const showAnswer = (selectedAnswers[currentQuestion.id] !== undefined && !isExamMode) || studyMode;
                    let style = "bg-slate-950 border-slate-850 text-slate-300";
                    if (showAnswer) {
                      if (isCorrect) style = "bg-emerald-950/80 border-emerald-500 text-emerald-200 font-bold";
                      else if (isSelected) style = "bg-rose-950/80 border-rose-500 text-rose-200";
                    } else if (isSelected) style = "bg-emerald-900/60 border-emerald-500 text-emerald-200";
                    return (
                      <button key={idx} onClick={() => handleSelectOption(currentQuestion.id, idx)} className={\`w-full p-3 rounded-xl border text-left text-xs sm:text-sm flex items-start gap-2.5 \${style}\`}>
                        <span className="w-5 h-5 rounded bg-slate-800 text-center text-xs font-bold shrink-0 mt-0.5">{['A','B','C','D'][idx]}</span>
                        <span className="flex-1">{opt}</span>
                      </button>
                    );
                  })}
                </div>
                {((selectedAnswers[currentQuestion.id] !== undefined && !isExamMode) || studyMode) && (
                  <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 text-xs space-y-2">
                    <p className="text-emerald-400 font-bold">✅ 正確答案：選項 {['A','B','C','D'][currentQuestion.answer]}</p>
                    <p className="text-slate-300">{currentQuestion.explanation}</p>
                    {currentQuestion.mnemonic && <div className="p-2 rounded bg-amber-500/10 border border-amber-500/30 text-amber-200">🎯 {currentQuestion.mnemonic}</div>}
                  </div>
                )}
                <div className="flex justify-between items-center pt-2 border-t border-slate-800 text-xs">
                  <button onClick={() => setCurrentIdx(p => Math.max(0, p - 1))} disabled={currentIdx === 0} className="px-3 py-1.5 rounded-lg bg-slate-800 disabled:opacity-30">上一題</button>
                  <span className="text-slate-400 font-mono">{currentIdx + 1} / {filteredQuestions.length}</span>
                  <button onClick={() => setCurrentIdx(p => Math.min(filteredQuestions.length - 1, p + 1))} disabled={currentIdx === filteredQuestions.length - 1} className="px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-bold disabled:opacity-30">下一題</button>
                </div>
              </div>
            ) : <div className="p-8 text-center text-slate-500 text-xs bg-slate-900 rounded-xl">目前分類無題目</div>}
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  <\/script>
</body>
</html>`;

  const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8;' });
  const downloadLink = document.createElement('a');
  downloadLink.href = URL.createObjectURL(blob);
  downloadLink.download = '金融與保險證照通關題庫.html';
  document.body.appendChild(downloadLink);
  downloadLink.click();
  document.body.removeChild(downloadLink);
  console.log('✅ 下載成功！檔案已存至您的下載資料夾。');
})();
